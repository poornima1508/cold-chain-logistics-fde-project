name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: cold-chain-copilot:latest
        load: true

    - name: Run Container & Verify Health
      run: |
        docker run -d --name test-copilot -p 8000:8000 cold-chain-copilot:latest
        sleep 5
        curl --fail http://localhost:8000/shipments || exit 1
        docker stop test-copilot

services:
  db:
    image: postgres:15-alpine
    container_name: cold_chain_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cold_chain_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  copilot-app:
    build: .
    container_name: cold_chain_copilot_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/cold_chain_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - db

volumes:
  postgres_data: